<h1>Payment</h1>
<p>Please enter your payment details below and complete your booking.</p>



<form action="Confirmation.html" method="post">
    <h3>Credit Card Details</h3>

    <label for="cardName">Name on Card:</label>
    <input type="text" id="cardName" name="cardName" required><br><br>
    <label for="cardNumber">Card Number:</label>
    <input type="text" id="cardNumber" name="cardNumber" required><br><br>

    <label for="expiryDate">Expiry Date:</label>
    <input type="text" id="expiryDate" name="expiryDate" placeholder="MM/YY" required><br><br>

    <label for="cvv">CVV:</label>
    <input type="text" id="cvv" name="cvv" required><br><br>

    <h3>Billing Address</h3>
    <label for="address">Address:</label>
    <input type="text" id="address" name="address" required><br><br>
    <label for="city">City:</label>
    <input type="text" id="city" name="city" required><br><br>
    <label for="state">State:</label>
    <input type="text" id="state" name="state" required><br><br>
    <label for="zip">Zip Code:</label>
    <input type="text" id="zip" name="zip" required><br><br>

    <h3>Contact Information</h3>
    <label for="email">Email:</label>
    <input type="email" id="email" name="email" required><br><br>
    <label for="phone">Phone:</label>
    <input type="text" id="phone" name="phone" required><br><br>

    <button type="submit"
        style="background-color: #056608; color: white; border: none; padding: 10px 20px; border-radius: 4px;">Pay
        Now</button>
